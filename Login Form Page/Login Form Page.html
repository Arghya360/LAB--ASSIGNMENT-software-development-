<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      :root {
        --bg-dark: #0f172a;
        --input-border: rgba(255, 255, 255, 0.75);
        --white: #ffffff;
        --text: #e5e7eb;
        --muted: rgba(255, 255, 255, 0.8);
        --shadow: rgba(15, 23, 42, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.65), rgba(30, 41, 59, 0.48)),
          url("https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1600&q=80")
            center/cover no-repeat;
        color: var(--white);
      }

      .login-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 24px;
      }

      .login-box {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 16px;
        box-shadow: 0 20px 50px var(--shadow);
        padding: 38px 28px;
      }

      .login-title {
        text-align: center;
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 24px;
      }

      .login-form {
        display: grid;
        gap: 18px;
      }

      .input-box {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 2px solid var(--input-border);
        border-radius: 999px;
        padding: 0 18px;
        background: rgba(255, 255, 255, 0.02);
      }

      .input-box i {
        font-size: 1.2rem;
        color: var(--white);
        opacity: 0.9;
      }

      .input-box input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--white);
        padding: 16px 0;
        font-size: 1rem;
      }

      .input-box input::placeholder {
        color: rgba(255, 255, 255, 0.9);
      }

      .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8125rem;
        gap: 12px;
        margin-top: 4px;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
      }

      .remember input {
        width: 14px;
        height: 14px;
        accent-color: white;
      }

      .forgot-link,
      .register a {
        color: var(--white);
        text-decoration: none;
      }

      .forgot-link:hover,
      .register a:hover {
        text-decoration: underline;
      }

      .login-btn {
        border: none;
        border-radius: 999px;
        background: var(--white);
        color: #111827;
        font-size: 1rem;
        font-weight: 600;
        padding: 16px 18px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .login-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(255, 255, 255, 0.18);
      }

      .register {
        text-align: center;
        font-size: 0.8125rem;
        color: var(--muted);
      }

      @media (max-width: 480px) {
        .login-box {
          padding: 32px 20px;
        }

        .options {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-box">
        <h1 class="login-title">Login</h1>

        <form class="login-form">
          <div class="input-box">
            <i class="ri-mail-fill"></i>
            <input type="email" placeholder="Email ID" required />
          </div>

          <div class="input-box">
            <i class="ri-lock-2-fill"></i>
            <input type="password" placeholder="Password" required />
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn">Login</button>

          <div class="register">
            Don’t have an account? <a href="#">Register</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
