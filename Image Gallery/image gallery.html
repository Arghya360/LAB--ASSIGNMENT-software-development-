<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Gallery</title>
<style>
  :root{
    --ink:#0e0e0e;
    --grey:#5a5a5a;
    --page-bg:#f6f5f3;
    --radius:16px;
    --gap:20px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--page-bg);
    font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
  }

  .community{
    max-width:1100px;
    margin:0 auto;
    padding:70px 24px 70px;
    text-align:center;
  }

  .community h1{
    margin:0 0 10px;
    font-size:clamp(42px, 7vw, 64px);
    font-weight:800;
    letter-spacing:-1px;
    font-family:"Segoe UI", Arial, sans-serif;
  }

  .hashtag{
    margin:0 0 40px;
    font-size:13px;
    font-weight:700;
    color:var(--grey);
    letter-spacing:.2px;
  }
  .hashtag strong{ color:var(--ink); }

  /* ---------------- CSS GRID GALLERY ---------------- */
  .gallery{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-auto-rows:190px;
    grid-auto-flow:dense;
    gap:var(--gap);
  }

  .gallery-item{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    background:#ddd;
  }

  .gallery-item.tall{ grid-row:span 2; }

  .gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .35s ease;
  }

  .gallery-item:hover img{ transform:scale(1.06); }

  /* ---------------- RESPONSIVE ---------------- */
  @media (max-width:860px){
    .gallery{
      grid-template-columns:repeat(2, 1fr);
      grid-auto-rows:170px;
    }
  }

  @media (max-width:560px){
    .community{ padding:48px 18px 48px; }
    .gallery{
      grid-template-columns:1fr;
      grid-auto-rows:220px;
      gap:14px;
    }
    .gallery-item.tall{ grid-row:span 1; }
  }
</style>
</head>
<body>

<section class="community">
  <h1>SYLHET</h1>
  <p class="hashtag">Most <strong>Beautiful</strong> place in  Bangladesh</p>

  <div class="gallery">
    <div class="gallery-item tall">
      <img src="asset/1.webp" alt="Friends on the beach">
    </div>
    <div class="gallery-item">
      <img src="asset/2.webp" alt="Picnic in the park">
    </div>
    <div class="gallery-item tall">
      <img src="asset/3.webp" alt="Pool volleyball">
    </div>
    <div class="gallery-item">
      <img src="asset/4.webp" alt="Concert crowd">
    </div>
    <div class="gallery-item">
      <img src="asset/5.webp" alt="Go-kart race">
    </div>
    <div class="gallery-item">
      <img src="asset/6.webp" alt="Road trip">
    </div>
  </div>
</section>

</body>
</html>
